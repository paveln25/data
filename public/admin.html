<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel de Pedidos</title>
<style>
  :root { --bg:#0f172a; --card:#1e293b; --accent:#22c55e; --text:#e2e8f0; --muted:#94a3b8; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background:var(--bg); color:var(--text); padding:24px; }
  .login-box { max-width: 360px; margin: 80px auto; background: var(--card); padding: 28px; border-radius: 14px; }
  .login-box input { width:100%; padding:10px; margin-bottom:14px; border-radius:8px; border:1px solid #334155; background:#0f172a; color:var(--text); }
  .login-box button, .toolbar button { background: var(--accent); color:#04210f; border:none; padding:10px 16px; border-radius:8px; font-weight:600; cursor:pointer; }
  table { width:100%; border-collapse: collapse; margin-top:20px; font-size:0.9rem; }
  th, td { text-align:left; padding:8px 10px; border-bottom:1px solid #334155; }
  th { color: var(--muted); font-weight:600; }
  a { color: var(--accent); }
  .err { color:#f87171; font-size:0.85rem; }
  .hidden { display:none; }
  .toolbar { display:flex; justify-content:space-between; align-items:center; margin-bottom: 10px; }
</style>
</head>
<body>

  <div class="login-box" id="loginBox">
    <h2>Panel de pedidos</h2>
    <input id="pass" type="password" placeholder="Contraseña de administrador">
    <button onclick="login()">Entrar</button>
    <p class="err" id="loginErr"></p>
  </div>

  <div id="panel" class="hidden">
    <div class="toolbar">
      <h2>Pedidos recibidos</h2>
      <button onclick="logout()">Salir</button>
    </div>
    <table>
      <thead>
        <tr>
          <th>Fecha</th><th>Nombre</th><th>Teléfono</th><th>Detalle</th>
          <th>IP</th><th>País/Ciudad</th><th>Ubicación</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

<script>
function getPass() { return sessionStorage.getItem('adminPass'); }

async function cargarRegistros() {
  const pass = getPass();
  const res = await fetch('/api/registros', { headers: { 'X-Admin-Password': pass } });
  if (!res.ok) {
    sessionStorage.removeItem('adminPass');
    mostrarLogin('Sesión expirada o contraseña incorrecta.');
    return;
  }
  const { registros } = await res.json();
  const tbody = document.getElementById('tbody');
  tbody.innerHTML = registros.map(r => `
    <tr>
      <td>${new Date(r.fecha).toLocaleString()}</td>
      <td>${r.nombre}</td>
      <td>${r.telefono}</td>
      <td>${r.detalle}</td>
      <td>${r.ip}</td>
      <td>${r.pais || '?'} / ${r.ciudad || '?'}</td>
      <td>${r.lat && r.lng ? `<a href="https://maps.google.com/?q=${r.lat},${r.lng}" target="_blank">Ver mapa</a>` : '—'}</td>
    </tr>
  `).join('');
}

function mostrarPanel() {
  document.getElementById('loginBox').classList.add('hidden');
  document.getElementById('panel').classList.remove('hidden');
  cargarRegistros();
}

function mostrarLogin(err) {
  document.getElementById('panel').classList.add('hidden');
  document.getElementById('loginBox').classList.remove('hidden');
  document.getElementById('loginErr').textContent = err || '';
}

async function login() {
  const pass = document.getElementById('pass').value;
  const res = await fetch('/api/registros', { headers: { 'X-Admin-Password': pass } });
  if (res.ok) {
    sessionStorage.setItem('adminPass', pass);
    mostrarPanel();
  } else {
    document.getElementById('loginErr').textContent = 'Contraseña incorrecta.';
  }
}

function logout() {
  sessionStorage.removeItem('adminPass');
  mostrarLogin();
}

if (getPass()) { mostrarPanel(); }
</script>
</body>
</html>
